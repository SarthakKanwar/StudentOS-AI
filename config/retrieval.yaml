# StudentOS — retrieval, chunking and grounding configuration
#
# This file is VERSION CONTROLLED on purpose (requirements.md NFR-13).
# Evaluation runs record a snapshot of it, so any score can be traced back
# to the exact settings that produced it (evaluation.md section 5).
#
# Secrets and deployment-specific values do NOT belong here — those live in
# .env, which is gitignored. Nothing in this file is sensitive.

# ── Chunking ──────────────────────────────────────────────────────────
# How documents are split before embedding. Changing anything here requires
# re-ingesting the corpus and re-running threshold calibration.
#
# tokenizer/encoding define what "token" means everywhere in this file and in
# chunks.token_count. Without them the sizes below would be ambiguous, and two
# implementations could chunk the same PDF differently.
chunking:
  tokenizer: tiktoken
  encoding: cl100k_base
  chunk_size_tokens: 800
  chunk_overlap_tokens: 150

# ── Retrieval ─────────────────────────────────────────────────────────
# top_k:               chunks fetched from the index before filtering
# max_context_chunks:  chunks actually sent to the model (cost driver)
retrieval:
  top_k: 8
  max_context_chunks: 5

  # Hybrid retrieval: dense cosine fused with SQLite FTS5 keyword ranking.
  #
  # Dense embeddings under-weight rare literal tokens — course codes, regulation
  # numbers, exact values in tables. A chunk holding a table of ten subjects
  # embeds as a blur of all ten, so it loses to a long document *about* one of
  # them. Keyword matching ranks those literals first; fusing the two orderings
  # fixes the ranking without touching thresholds or any gate.
  #
  # Fusion affects ORDER ONLY. SearchResult.score stays the true cosine value,
  # so Gate 1 still thresholds on a real similarity.
  hybrid_enabled: true
  keyword_candidates: 25 # depth at which BOTH rankings are fused

  # RRF constant. The usual default is 60, which was tuned for TREC runs whose
  # candidate lists hold thousands of documents. At that scale k=60 still leaves
  # useful separation between ranks; over a corpus of tens of chunks it does
  # not — ranks 1 and 25 end up within 1.65x of each other, so fusion degrades
  # into "appears in both lists" and ignores how well each ranked. A smaller k
  # restores that separation at this corpus size.
  #
  # NOT calibrated. Chosen by measuring rank movement on a handful of real
  # questions, which is a sanity check rather than an evaluation. Revisit
  # alongside tau_min when the calibration set exists.
  rrf_k: 5

# ── Grounding thresholds (Gate 1) ─────────────────────────────────────
# tau_min:     minimum cosine similarity for the single best chunk.
#              Below this, the system returns "not found" WITHOUT calling
#              the chat model at all.
# tau_support: minimum similarity for a chunk to count as supporting
#              evidence.
#
# WARNING: the values below are UNCALIBRATED starting points, not findings.
# Similarity distributions depend on the embedding model and the corpus, so
# a threshold copied from elsewhere is meaningless. These must be calibrated
# against our own evaluation set before the demo — see the procedure in
# grounding-strategy.md section 7.
grounding:
  tau_min: 0.35
  tau_support: 0.30

# ── Calibration record ────────────────────────────────────────────────
# Updated whenever thresholds are calibrated. Keeping the provenance here
# means a future reader can tell whether the numbers above were measured
# or guessed.
calibration:
  status: uncalibrated
  calibrated_on: null      # date of the calibration run
  corpus: null             # which document set it was calibrated against
  embedding_model: null    # calibration is only valid for one embedding model
  notes: >
    Initial values set during planning. No calibration run has been
    performed yet. Do not present these numbers as validated.
